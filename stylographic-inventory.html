<title>Stylographic — Pen & Ink Collection</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --gunmetal:      #1E2328;
  --gunmetal-mid:  #2C3340;
  --brass:         #B8965A;
  --brass-light:   #D4AE78;
  --brass-pale:    #F2EAD8;
  --cream:         #F5F0E8;
  --cream-dark:    #EDE6D8;
  --teal:          #2A4A50;
  --ink:           #1A1C20;
  --mist:          #8A9098;
  --shadow:        rgba(10,12,16,.15);
  --rule:          rgba(184,150,90,.22);
}
body { font-family:'Plus Jakarta Sans',sans-serif; background:var(--cream); color:var(--ink); min-height:100vh; }

header { background:var(--gunmetal); padding:36px 44px 30px; position:relative; overflow:hidden; }
header::before {
  content:''; position:absolute; inset:0;
  background-image:none;
}
header::after { content:''; position:absolute; bottom:0; left:0; right:0; height:2px; background:linear-gradient(90deg,transparent,var(--brass),transparent); }
.header-inner { position:relative; display:flex; align-items:center; gap:22px; }
.header-eyebrow { font-size:.6rem; letter-spacing:.22em; text-transform:uppercase; color:var(--brass); margin-bottom:7px; font-weight:400; }
header h1 { font-family:'Plus Jakarta Sans',sans-serif; font-size:2.5rem; font-weight:300; color:#F5F0E8; letter-spacing:.03em; line-height:1; }
header h1 em { font-style:italic; font-weight:200; color:var(--brass-light); }
header p { font-size:.68rem; color:rgba(255,255,255,.32); margin-top:7px; letter-spacing:.12em; text-transform:uppercase; }

.sync-bar { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; padding:8px 44px; background:var(--gunmetal-mid); border-bottom:1px solid rgba(184,150,90,.12); font-size:.72rem; }
.sync-status { display:flex; align-items:center; gap:8px; color:rgba(255,255,255,.38); }
.sync-dot { width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.18); flex-shrink:0; transition:background .3s; }
.sync-dot.connected { background:#5aab7a; }
.sync-dot.saving    { background:var(--brass); animation:pulse .8s infinite; }
.sync-dot.error     { background:#b05050; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
.sync-actions { display:flex; gap:8px; }
.btn-sync { font-family:'Plus Jakarta Sans',sans-serif; font-size:.63rem; font-weight:500; letter-spacing:.1em; text-transform:uppercase; padding:4px 14px; border-radius:2px; border:1px solid rgba(184,150,90,.35); background:transparent; color:var(--brass-light); cursor:pointer; transition:all .18s; }
.btn-sync:hover { border-color:var(--brass); color:var(--brass); }
.btn-sync.primary { background:var(--brass); border-color:var(--brass); color:var(--gunmetal); font-weight:500; }
.btn-sync.primary:hover { background:var(--brass-light); }

.config-notice { margin:18px 44px; padding:13px 17px; background:#fff8e6; border:1px solid #d4ae78; border-radius:2px; font-size:.78rem; line-height:1.6; color:#5a4000; }
.config-notice strong { display:block; margin-bottom:3px; }
.config-notice code { background:#f0e8c8; padding:1px 5px; border-radius:2px; font-family:monospace; font-size:.75rem; }

.tab-bar { display:flex; gap:2px; padding:0 44px; background:white; border-bottom:1px solid var(--rule); }
.tab { font-family:'Plus Jakarta Sans',sans-serif; font-size:.68rem; font-weight:500; letter-spacing:.1em; text-transform:uppercase; padding:14px 18px; cursor:pointer; border:none; background:none; color:#bbb; border-bottom:2px solid transparent; margin-bottom:-1px; transition:all .18s; }
.tab:hover { color:var(--brass); }
.tab.active { color:var(--gunmetal); border-bottom-color:var(--brass); }

.content { padding:24px 44px 60px; max-width:1140px; }

.metrics { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; margin-bottom:22px; }
.metric { background:white; border:1px solid var(--rule); border-radius:3px; padding:14px 18px; box-shadow:0 2px 8px var(--shadow); }
.metric-label { font-size:.6rem; text-transform:uppercase; letter-spacing:.1em; color:#bbb; margin-bottom:5px; }
.metric-value { font-family:'Plus Jakarta Sans',sans-serif; font-size:2.1rem; font-weight:400; color:var(--gunmetal); line-height:1; }

.controls { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; align-items:center; padding:12px 16px; background:white; border:1px solid var(--rule); border-radius:3px; box-shadow:0 2px 8px var(--shadow); }
.search-wrap { position:relative; flex:1; min-width:160px; }
.search-wrap input { width:100%; padding:6px 11px 6px 32px; border:1px solid var(--cream-dark); border-radius:2px; font-family:'Plus Jakarta Sans',sans-serif; font-size:.78rem; color:var(--ink); outline:none; transition:border-color .18s; background:var(--cream); }
.search-wrap input:focus { border-color:var(--brass); background:white; }
.search-wrap svg { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:#bbb; pointer-events:none; }
.controls select { font-family:'Plus Jakarta Sans',sans-serif; font-size:.74rem; padding:6px 10px; border:1px solid var(--cream-dark); border-radius:2px; background:var(--cream); color:var(--ink); cursor:pointer; outline:none; transition:border-color .18s; }
.controls select:focus { border-color:var(--brass); }
.filter-row { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
.filter-label { font-size:.58rem; text-transform:uppercase; letter-spacing:.12em; color:#ccc; flex-shrink:0; min-width:52px; }
.filter-pill { font-family:'Plus Jakarta Sans',sans-serif; font-size:.65rem; font-weight:500; letter-spacing:.07em; text-transform:uppercase; padding:4px 12px; border-radius:20px; border:1.5px solid var(--cream-dark); background:white; color:#aaa; cursor:pointer; transition:all .18s; white-space:nowrap; }
.filter-pill:hover { border-color:var(--brass); color:var(--gunmetal); }
.filter-pill.active { background:var(--gunmetal); border-color:var(--gunmetal); color:var(--brass-light); }

.btn-add { font-family:'Plus Jakarta Sans',sans-serif; font-size:.67rem; font-weight:500; letter-spacing:.1em; text-transform:uppercase; padding:6px 17px; border-radius:2px; border:none; background:var(--gunmetal); color:var(--brass-light); cursor:pointer; transition:all .18s; white-space:nowrap; }
.btn-add:hover { background:var(--teal); }

.table-wrap { background:white; border:1px solid var(--rule); border-radius:3px; overflow:hidden; box-shadow:0 2px 8px var(--shadow); }
table { width:100%; border-collapse:collapse; font-size:.79rem; }
th { text-align:left; padding:10px 14px; font-size:.6rem; font-weight:500; letter-spacing:.1em; text-transform:uppercase; color:#bbb; background:var(--cream); border-bottom:1px solid var(--rule); white-space:nowrap; }
td { padding:11px 14px; border-bottom:1px solid var(--cream-dark); vertical-align:middle; color:var(--ink); }
tr:last-child td { border-bottom:none; }
tr.clickable { cursor:pointer; transition:background .12s; }
tr.clickable:hover td { background:var(--brass-pale); }
tr.gifted td { opacity:.45; }

.badge { display:inline-block; font-size:.6rem; font-weight:500; letter-spacing:.07em; text-transform:uppercase; padding:3px 8px; border-radius:2px; }
.b-working  { background:#d8eee4; color:#1a5c38; }
.b-resting  { background:#dde8ec; color:#1a4a58; }
.b-enroute  { background:#e8e4d8; color:#6a5020; }
.b-gifted   { background:#ece8dc; color:#6a5830; }
.b-yes      { background:#ece4d8; color:#7a5020; }
.b-no       { background:#eeeae4; color:#888070; }
.b-limited  { background:#e4dcd0; color:#6a4820; }

.back-btn { font-family:'Plus Jakarta Sans',sans-serif; font-size:.68rem; letter-spacing:.08em; text-transform:uppercase; color:#bbb; cursor:pointer; background:none; border:none; display:flex; align-items:center; gap:5px; margin-bottom:18px; transition:color .15s; }
.back-btn:hover { color:var(--brass); }
.panel { background:white; border:1px solid var(--rule); border-radius:3px; padding:22px; margin-bottom:14px; box-shadow:0 2px 8px var(--shadow); }
.panel-title { font-family:'Plus Jakarta Sans',sans-serif; font-size:1.7rem; font-weight:300; color:var(--gunmetal); margin-bottom:3px; }
.panel-sub { font-size:.75rem; color:#aaa; letter-spacing:.04em; margin-bottom:18px; }
.detail-grid { display:grid; grid-template-columns:1fr 1fr; gap:0 32px; }

.section-title { font-size:.62rem; font-weight:500; letter-spacing:.12em; text-transform:uppercase; color:#bbb; margin-bottom:13px; margin-top:3px; }

.btn-danger { color:#a03030; border-color:#e0c0c0; }

.care-entry { display:grid; grid-template-columns:100px 1fr 1fr auto; gap:10px; padding:9px 0; border-bottom:1px solid var(--cream-dark); font-size:.79rem; align-items:baseline; }
.care-date { font-size:.7rem; color:#bbb; }
.care-note { font-size:.7rem; color:#aaa; grid-column:2/5; padding-top:2px; }

.journal-entry { padding:15px 0; border-bottom:1px solid var(--cream-dark); }
.journal-entry:last-child { border-bottom:none; }
.journal-date { font-size:.7rem; color:#bbb; margin-bottom:3px; }
.journal-meta { font-size:.7rem; color:var(--brass); margin-bottom:7px; letter-spacing:.03em; }
.journal-note { font-size:.81rem; line-height:1.75; color:var(--ink); }
.empty { font-family:'Plus Jakarta Sans',sans-serif; font-style:italic; color:#ccc; font-size:1rem; padding:.75rem 0; }

.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.form-grid.three { grid-template-columns:1fr 1fr 1fr; }
.form-full { grid-column:1/-1; }
.form-row { display:flex; flex-direction:column; gap:4px; }
.form-label { font-size:.6rem; text-transform:uppercase; letter-spacing:.1em; color:#aaa; }
.form-row input,.form-row select,.form-row textarea { font-family:'Plus Jakarta Sans',sans-serif; font-size:.81rem; padding:7px 10px; border:1px solid var(--cream-dark); border-radius:2px; background:var(--cream); color:var(--ink); outline:none; transition:border-color .18s; width:100%; }
.form-row input:focus,.form-row select:focus,.form-row textarea:focus { border-color:var(--brass); background:white; }

.modal-overlay { position:fixed; inset:0; background:rgba(10,12,16,.6); display:flex; align-items:center; justify-content:center; z-index:100; padding:1rem; }
.modal { background:var(--cream); border-top:3px solid var(--brass); border-radius:3px; padding:26px; width:min(540px,90vw); max-height:88vh; overflow-y:auto; box-shadow:0 24px 64px rgba(10,12,16,.4); animation:slideUp .2s ease; }

function cycleStatus(id){const p=pens.find(x=>x.id===id);p.status=p.status==='Working'?'Resting':p.status==='Resting'?'En Route':'Working';scheduleSave();renderPenDetail();}
function markGifted(id){const p=pens.find(x=>x.id===id);const name=prompt('Gifted to:','');if(name===null)return;p.status='Gifted';p.gifted_to=name||'';scheduleSave();renderPenDetail();}
function deletePen(id){if(!confirm('Remove this pen?'))return;pens=pens.filter(p=>p.id!==id);penDetail=null;scheduleSave();renderPens();}
function inkInUseByOtherPen(inkName,excludePenId){return pens.some(p=>p.id!==excludePenId&&p.status==='Working'&&p.care.length>0&&p.care.filter(c=>c.ink&&(c.type==='Fill only'||c.type==='Empty, Clean, Fill')).slice(-1)[0]?.ink===inkName);}
function addCare(pid){const p=pens.find(x=>x.id===pid);const d=document.getElementById('care-date').value;const t=document.getElementById('care-type').value;const ink=document.getElementById('care-ink').value;const note=document.getElementById('care-note').value;if(!d){alert('Please enter a date');return;}const isFill=t==='Fill only'||t==='Empty, Clean, Fill';const isEmpty=t==='Empty, Clean'||t==='Empty, Clean, Fill';if(isFill&&!ink){alert('Please select an ink for a fill entry');return;}const prevInk=p.care.filter(c=>c.ink&&(c.type==='Fill only'||c.type==='Empty, Clean, Fill')).slice(-1)[0]?.ink||'';const[y,mo,da]=d.split('-');p.care.push({id:uid(),date:`${parseInt(mo)}/${parseInt(da)}/${y}`,type:t,ink,note});if(isFill)p.status='Working';else if(isEmpty)p.status='Resting';if(isFill){const i=inks.find(x=>x.name===ink);if(i)i.status='Working';}if(isEmpty&&prevInk){if(!inkInUseByOtherPen(prevInk,pid)){const pi=inks.find(x=>x.name===prevInk);if(pi)pi.status='Resting';}}scheduleSave();renderPenDetail();}
function currentInkForPen(pen){let ink='';pen.care.forEach(c=>{if(c.ink&&(c.type==='Fill only'||c.type==='Empty, Clean, Fill'))ink=c.ink;if(c.type==='Empty, Clean')ink='';});return ink;}
function recalcPenInkStatus(p){const ink=currentInkForPen(p);p.status=ink?'Working':'Resting';inks.forEach(i=>{i.status=pens.some(pen=>currentInkForPen(pen)===i.name)?'Working':'Resting';});}
function deleteCare(pid,cid){const p=pens.find(x=>x.id===pid);p.care=p.care.filter(c=>c.id!==cid);recalcPenInkStatus(p);scheduleSave();renderPenDetail();}

    <tbody>${data.map(i=>`<tr class="clickable" onclick="openInk('${i.id}')"><td>${esc(i.name)}</td><td>${esc(i.maker)}</td><td>${esc(i.color)}</td><td>${esc(i.size)}</td><td><span class="badge ${i.shimmer==='Yes'?'b-yes':'b-no'}">${esc(i.shimmer||'\u2014')}</span></td><td><span class="badge ${i.sheen&&i.sheen!=='No'?'b-yes':'b-no'}">${esc(i.sheen||'\u2014')}</span></td><td><span class="badge ${i.shading&&i.shading!=='No'?'b-yes':'b-no'}">${esc(i.shading||'\u2014')}</span></td><td>${i.limited?'<span class="badge b-limited">Yes</span>':'<span class="badge b-no">No</span>'}</td><td><span class="badge b-${i.status==='En Route'?'enroute':(i.status||'resting').toLowerCase()}">${esc(i.status)}</span></td><td>${i.purchase>0?'$'+i.purchase.toFixed(2):'\u2014'}</td></tr>`).join('')}
    ${data.length===0?'<tr><td colspan="10" style="text-align:center;color:#ccc;padding:3rem;font-style:italic;font-family:\'Plus Jakarta Sans\',sans-serif;font-size:1rem">No inks match</td></tr>':''}
    </tbody></table></div>`;
}

function openInk(id){inkDetail=id;renderInkDetail();}

  document.getElementById('tab-content').innerHTML=`<button class="back-btn" onclick="inkDetail=null;renderInks()">\u2190 Back to inks</button>
  <div class="panel">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px">
      <div><div class="panel-title">${esc(i.name)}</div><div class="panel-sub">${esc(i.maker)}</div></div>
      <span class="badge b-${i.status==='En Route'?'enroute':(i.status||'resting').toLowerCase()}">${esc(i.status)}</span>
    </div>
    <div class="detail-grid">
      <div class="detail-row"><div class="detail-label">Color family</div><div class="detail-value">${esc(i.color)}</div></div>
      <div class="detail-row"><div class="detail-label">Size</div><div class="detail-value">${esc(i.size)}</div></div>
      <div class="detail-row form-full" style="grid-column:1/-1"><div class="detail-label">Currently inked in</div><div class="detail-value">${(()=>{const penList=pens.filter(p=>currentInkForPen(p)===i.name).map(p=>p.model);return penList.length?penList.map(m=>esc(m)).join(', '):'\u2014';})()}</div></div>
      <div class="detail-row"><div class="detail-label">Shimmer</div><div class="detail-value"><span class="badge ${i.shimmer==='Yes'?'b-yes':'b-no'}">${esc(i.shimmer||'\u2014')}</span></div></div>
      <div class="detail-row"><div class="detail-label">Sheen</div><div class="detail-value"><span class="badge ${i.sheen&&i.sheen!=='No'?'b-yes':'b-no'}">${esc(i.sheen||'\u2014')}</span></div></div>
      <div class="detail-row"><div class="detail-label">Shading</div><div class="detail-value"><span class="badge ${i.shading&&i.shading!=='No'?'b-yes':'b-no'}">${esc(i.shading||'\u2014')}</span></div></div>
      <div class="detail-row"><div class="detail-label">Limited edition</div><div class="detail-value">${i.limited?'Yes':'No'}</div></div>
      <div class="detail-row"><div class="detail-label">Retail price</div><div class="detail-value">${i.retail>0?'$'+i.retail.toFixed(2):'\u2014'}</div></div>
      <div class="detail-row"><div class="detail-label">Purchase price</div><div class="detail-value">${i.purchase>0?'$'+i.purchase.toFixed(2):'\u2014'}</div></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="toggleInkStatus('${i.id}')">${i.status==='Working'?'Mark resting':i.status==='Resting'?'Mark en route':'Mark working'}</button>
      <button class="btn" onclick="showEditInk('${i.id}')">Edit</button>
      <button class="btn btn-danger" onclick="deleteInk('${i.id}')">Remove</button>
    </div>
  </div>`;
}

function toggleInkStatus(id){const i=inks.find(x=>x.id===id);i.status=i.status==='Working'?'Resting':i.status==='Resting'?'En Route':'Working';scheduleSave();renderInkDetail();}
function deleteInk(id){if(!confirm('Remove this ink?'))return;inks=inks.filter(i=>i.id!==id);inkDetail=null;scheduleSave();renderInks();}

function showAddInk(){
  const makers=[...new Set(inks.map(i=>i.maker))].sort();
  showModal('Add ink',`<div class="form-grid"><div class="form-row form-full"><div class="form-label">Ink name</div><input type="text" id="f-name"></div><div class="form-row"><div class="form-label">Maker</div><input type="text" id="f-maker" list="iml"><datalist id="iml">${makers.map(m=>`<option value="${esc(m)}">`).join('')}</datalist></div><div class="form-row"><div class="form-label">Color family</div><input type="text" id="f-color"></div><div class="form-row"><div class="form-label">Size</div><input type="text" id="f-size" placeholder="50ml"></div><div class="form-row"><div class="form-label">Shimmer</div><select id="f-shimmer"><option value="">—</option><option>No</option><option>Yes</option></select></div><div class="form-row"><div class="form-label">Sheen</div><select id="f-sheen"><option value="">—</option><option>No</option><option>Low</option><option>Medium</option><option>High</option></select></div><div class="form-row"><div class="form-label">Shading</div><select id="f-shading"><option value="">—</option><option>No</option><option>Low</option><option>Medium</option><option>High</option></select></div><div class="form-row"><div class="form-label">Limited edition</div><select id="f-limited"><option value="false">No</option><option value="true">Yes</option></select></div><div class="form-row"><div class="form-label">Retail price</div><input type="text" id="f-retail" placeholder="0.00"></div><div class="form-row"><div class="form-label">Purchase price</div><input type="text" id="f-purchase" placeholder="0.00"></div></div>`,()=>{const name=document.getElementById('f-name').value.trim();const maker=document.getElementById('f-maker').value.trim();if(!name||!maker){alert('Name and maker required');return;}inks.push({id:uid(),name,maker,color:document.getElementById('f-color').value||'',shimmer:document.getElementById('f-shimmer').value,sheen:document.getElementById('f-sheen').value,shading:document.getElementById('f-shading').value,limited:document.getElementById('f-limited').value==='true',size:document.getElementById('f-size').value||'',retail:parseFloat(document.getElementById('f-retail').value)||0,purchase:parseFloat(document.getElementById('f-purchase').value)||0,status:'Resting'});scheduleSave();closeModal();renderInks();});
}

function showEditInk(id){
  const i=inks.find(x=>x.id===id);
  showModal('Edit ink',`<div class="form-grid"><div class="form-row form-full"><div class="form-label">Ink name</div><input type="text" id="f-name" value="${esc(i.name)}"></div><div class="form-row"><div class="form-label">Maker</div><input type="text" id="f-maker" value="${esc(i.maker)}"></div><div class="form-row"><div class="form-label">Color family</div><input type="text" id="f-color" value="${esc(i.color)}"></div><div class="form-row"><div class="form-label">Size</div><input type="text" id="f-size" value="${esc(i.size)}"></div><div class="form-row"><div class="form-label">Shimmer</div><select id="f-shimmer">${['','No','Yes'].map(v=>`<option value="${v}"${i.shimmer===v?' selected':''}>${v||'\u2014'}</option>`).join('')}</select></div><div class="form-row"><div class="form-label">Sheen</div><select id="f-sheen">${['','No','Low','Medium','High'].map(v=>`<option value="${v}"${i.sheen===v?' selected':''}>${v||'\u2014'}</option>`).join('')}</select></div><div class="form-row"><div class="form-label">Shading</div><select id="f-shading">${['','No','Low','Medium','High'].map(v=>`<option value="${v}"${i.shading===v?' selected':''}>${v||'\u2014'}</option>`).join('')}</select></div><div class="form-row"><div class="form-label">Limited edition</div><select id="f-limited"><option value="false"${!i.limited?' selected':''}>No</option><option value="true"${i.limited?' selected':''}>Yes</option></select></div><div class="form-row"><div class="form-label">Retail price</div><input type="text" id="f-retail" value="${i.retail}"></div><div class="form-row"><div class="form-label">Purchase price</div><input type="text" id="f-purchase" value="${i.purchase}"></div></div>`,()=>{i.name=document.getElementById('f-name').value.trim()||i.name;i.maker=document.getElementById('f-maker').value.trim()||i.maker;i.color=document.getElementById('f-color').value;i.size=document.getElementById('f-size').value;i.shimmer=document.getElementById('f-shimmer').value;i.sheen=document.getElementById('f-sheen').value;i.shading=document.getElementById('f-shading').value;i.limited=document.getElementById('f-limited').value==='true';i.retail=parseFloat(document.getElementById('f-retail').value)||0;i.purchase=parseFloat(document.getElementById('f-purchase').value)||0;scheduleSave();closeModal();renderInkDetail();});
}

function renderAccessories(){
  const el=document.getElementById('tab-content');
  const sv=(document.getElementById('acc-search')||{}).value||'';
  const tf=(document.getElementById('acc-type')||{}).value||'';
  const sf=(document.getElementById('acc-status')||{}).value||'';
  const types=[...new Set(accessories.map(a=>a.type).filter(Boolean))].sort();
  const data=accessories.filter(a=>
    (!sv||a.name.toLowerCase().includes(sv.toLowerCase())||a.maker.toLowerCase().includes(sv.toLowerCase())||(a.type||'').toLowerCase().includes(sv.toLowerCase()))&&
    (!tf||a.type===tf)&&(!sf||a.status===sf));
  const active=accessories.filter(a=>a.status==='Active').length;
  const stored=accessories.filter(a=>a.status==='Stored').length;
  const gifted=accessories.filter(a=>a.status==='Gifted').length;
  const tv=accessories.reduce((s,a)=>s+(a.purchase||0),0);
  el.innerHTML=`
  <div class="metrics">
    <div class="metric"><div class="metric-label">Total</div><div class="metric-value">${accessories.length}</div></div>
    <div class="metric"><div class="metric-label">Active</div><div class="metric-value">${active}</div></div>
    <div class="metric"><div class="metric-label">Stored</div><div class="metric-value">${stored}</div></div>
    <div class="metric"><div class="metric-label">Collection value</div><div class="metric-value">${tv>0?'$'+tv.toLocaleString('en-US',{maximumFractionDigits:0}):'\u2014'}</div></div>
  </div>
  <div class="controls">
    <div class="search-wrap"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><input id="acc-search" placeholder="Search accessories\u2026" value="${esc(sv)}" oninput="renderAccessories()"></div>
    <select id="acc-type" onchange="renderAccessories()"><option value="">All types</option>${types.map(t=>`<option value="${esc(t)}"${tf===t?' selected':''}>${esc(t)}</option>`).join('')}</select>
    <select id="acc-status" onchange="renderAccessories()"><option value="">All statuses</option><option value="Active"${sf==='Active'?' selected':''}>Active</option><option value="En Route"${sf==='En Route'?' selected':''}>En Route</option><option value="Stored"${sf==='Stored'?' selected':''}>Stored</option><option value="Gifted"${sf==='Gifted'?' selected':''}>Gifted</option></select>
    <button class="btn-add" onclick="showAddAccessory()">+ Add accessory</button>
  </div>
  <div class="table-wrap"><table>
    <thead><tr><th>Name</th><th>Type</th><th>Maker</th><th>Status</th><th>Purchase</th><th>Notes</th></tr></thead>
    <tbody>${data.map(a=>`<tr class="${a.status==='Gifted'?'gifted':''}">
      <td style="font-weight:500">${esc(a.name)}</td>
      <td>${esc(a.type||'\u2014')}</td>
      <td>${esc(a.maker||'\u2014')}</td>
      <td><span class="badge b-${(a.status||'active').toLowerCase()}">${esc(a.status)}</span></td>
      <td>${a.purchase>0?'$'+a.purchase.toFixed(2):'\u2014'}</td>
      <td style="color:#aaa;font-size:.75rem;max-width:260px">${esc(a.note||'')}</td>
    </tr><tr style="border-bottom:1px solid var(--cream-dark)"><td colspan="6" style="padding:0 14px 10px;text-align:right">
      <button class="btn" style="font-size:.6rem;padding:3px 10px" onclick="showEditAccessory('${a.id}')">Edit</button>
      <button class="btn btn-danger" style="font-size:.6rem;padding:3px 10px;margin-left:4px" onclick="deleteAccessory('${a.id}')">Remove</button>
    </td></tr>`).join('')}
    ${data.length===0?'<tr><td colspan="6" style="text-align:center;color:#ccc;padding:3rem;font-style:italic;font-family:\'Plus Jakarta Sans\',sans-serif;font-size:1rem">No accessories match</td></tr>':''}
    </tbody></table></div>`;
}

function showAddAccessory(){
  const types=[...new Set(accessories.map(a=>a.type).filter(Boolean))].sort();
  showModal('Add accessory',`<div class="form-grid">
    <div class="form-row form-full"><div class="form-label">Name</div><input type="text" id="f-name" placeholder="e.g. TWSBI Eco Converter"></div>
    <div class="form-row"><div class="form-label">Type</div><input type="text" id="f-type" list="atl" placeholder="e.g. Converter"><datalist id="atl">${types.map(t=>`<option value="${esc(t)}">`).join('')}</datalist></div>
    <div class="form-row"><div class="form-label">Maker / Brand</div><input type="text" id="f-maker"></div>
    <div class="form-row"><div class="form-label">Purchase price</div><input type="text" id="f-purchase" placeholder="0.00"></div>
    <div class="form-row"><div class="form-label">Status</div><select id="f-status"><option>Active</option><option>En Route</option><option>Stored</option><option>Gifted</option></select></div>

function showEditAccessory(id){
  const a=accessories.find(x=>x.id===id);
  showModal('Edit accessory',`<div class="form-grid">
    <div class="form-row form-full"><div class="form-label">Name</div><input type="text" id="f-name" value="${esc(a.name)}"></div>
    <div class="form-row"><div class="form-label">Type</div><input type="text" id="f-type" value="${esc(a.type||'')}"></div>
    <div class="form-row"><div class="form-label">Maker / Brand</div><input type="text" id="f-maker" value="${esc(a.maker||'')}"></div>
    <div class="form-row"><div class="form-label">Purchase price</div><input type="text" id="f-purchase" value="${a.purchase||0}"></div>
    <div class="form-row"><div class="form-label">Status</div><select id="f-status"><option${a.status==='Active'?' selected':''}>Active</option><option${a.status==='En Route'?' selected':''}>En Route</option><option${a.status==='Stored'?' selected':''}>Stored</option><option${a.status==='Gifted'?' selected':''}>Gifted</option></select></div>
    <div class="form-row form-full"><div class="form-label">Notes</div><textarea id="f-note">${esc(a.note||'')}</textarea></div>
  </div>`,()=>{
    a.name=document.getElementById('f-name').value.trim()||a.name;

function deleteAccessory(id){if(!confirm('Remove this accessory?'))return;accessories=accessories.filter(a=>a.id!==id);scheduleSave();renderAccessories();}

function renderJournal(){
  const el=document.getElementById('tab-content');
  const sv=(document.getElementById('j-search')||{}).value||'';
  const data=journal.filter(j=>!sv||[j.pen,j.ink,j.accessory,j.note].join(' ').toLowerCase().includes(sv.toLowerCase())).slice().sort((a,b)=>{if(!a.date&&!b.date)return 0;if(!a.date)return 1;if(!b.date)return -1;return new Date(b.date)-new Date(a.date);});
  el.innerHTML=`<div class="controls" style="margin-bottom:18px"><div class="search-wrap"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><input id="j-search" placeholder="Search journal\u2026" value="${esc(sv)}" oninput="renderJournal()"></div><button class="btn-add" onclick="showAddJournal()">+ Add entry</button></div>
  <div class="panel">${data.length===0?'<div class="empty">No journal entries yet</div>':data.map(j=>`<div class="journal-entry">${j.date?`<div class="journal-date">${esc(j.date)}</div>`:''}<div class="journal-meta">${[j.pen&&`Pen: ${j.pen}`,j.ink&&`Ink: ${j.ink}`,j.accessory&&`Accessory: ${j.accessory}`].filter(Boolean).join(' \u00b7 ')||'General note'}</div><div class="journal-note">${esc(j.note)}</div><div class="btn-row" style="margin-top:10px"><button class="btn" style="font-size:.62rem;padding:4px 11px" onclick="showEditJournal('${j.id}')">Edit</button><button class="btn btn-danger" style="font-size:.62rem;padding:4px 11px" onclick="deleteJournal('${j.id}')">Remove</button></div></div>`).join('')}</div>`;
}

function showAddJournal(){
  const penNames=pens.map(p=>p.model).sort();const inkNames=inks.map(i=>i.name).sort();
  showModal('Add journal entry',`<div class="form-grid"><div class="form-row"><div class="form-label">Date</div><input type="date" id="f-date"></div><div class="form-row"><div class="form-label">Pen (optional)</div><select id="f-pen"><option value="">— none —</option>${penNames.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('')}</select></div><div class="form-row"><div class="form-label">Ink (optional)</div><select id="f-ink"><option value="">— none —</option>${inkNames.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('')}</select></div><div class="form-row"><div class="form-label">Accessory (optional)</div><input type="text" id="f-accessory"></div><div class="form-row form-full"><div class="form-label">Note</div><textarea id="f-note" placeholder="Your observations\u2026"></textarea></div></div>`,()=>{const note=document.getElementById('f-note').value.trim();if(!note){alert('Note is required');return;}const dv=document.getElementById('f-date').value;let dateStr='';if(dv){const[y,mo,da]=dv.split('-');dateStr=`${parseInt(mo)}/${parseInt(da)}/${y}`;}journal.push({id:uid(),date:dateStr,pen:document.getElementById('f-pen').value,ink:document.getElementById('f-ink').value,accessory:document.getElementById('f-accessory').value,note});scheduleSave();closeModal();renderJournal();});
}

function showEditJournal(id){
  const j=journal.find(x=>x.id===id);const penNames=pens.map(p=>p.model).sort();const inkNames=inks.map(i=>i.name).sort();
  showModal('Edit journal entry',`<div class="form-grid"><div class="form-row"><div class="form-label">Date</div><input type="date" id="f-date" ${j.date?`value="${j.date.replace(/(\d+)\/(\d+)\/(\d+)/,(_,m,d,y)=>y+'-'+m.padStart(2,'0')+'-'+d.padStart(2,'0'))}"`:''} ></div><div class="form-row"><div class="form-label">Pen</div><select id="f-pen"><option value="">— none —</option>${penNames.map(n=>`<option value="${esc(n)}"${j.pen===n?' selected':''}>${esc(n)}</option>`).join('')}</select></div><div class="form-row"><div class="form-label">Ink</div><select id="f-ink"><option value="">— none —</option>${inkNames.map(n=>`<option value="${esc(n)}"${j.ink===n?' selected':''}>${esc(n)}</option>`).join('')}</select></div><div class="form-row"><div class="form-label">Accessory</div><input type="text" id="f-accessory" value="${esc(j.accessory)}"></div><div class="form-row form-full"><div class="form-label">Note</div><textarea id="f-note">${esc(j.note)}</textarea></div></div>`,()=>{const note=document.getElementById('f-note').value.trim();if(!note){alert('Note is required');return;}const dv=document.getElementById('f-date').value;let dateStr='';if(dv){const[y,mo,da]=dv.split('-');dateStr=`${parseInt(mo)}/${parseInt(da)}/${y}`;}j.date=dateStr;j.pen=document.getElementById('f-pen').value;j.ink=document.getElementById('f-ink').value;j.accessory=document.getElementById('f-accessory').value;j.note=note;scheduleSave();closeModal();renderJournal();});
}

function deleteJournal(id){if(!confirm('Remove this entry?'))return;journal=journal.filter(j=>j.id!==id);scheduleSave();renderJournal();}

let modalCallback=null;
function showModal(title,body,onSave){
  modalCallback=onSave;
  document.getElementById('modal-root').innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-title">${esc(title)}</div>${body}<div class="modal-footer"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="modalCallback&&modalCallback()">Save</button></div></div></div>`;
}
function closeModal(){document.getElementById('modal-root').innerHTML='';modalCallback=null;}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
window.addEventListener('beforeunload',e=>{if(saveTimer){e.preventDefault();e.returnValue='';}});

render();
</script>
</body>
