<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200;0,300;0,400;0,500;1,200;1,300&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#EDEBE5;padding:48px 40px 72px;display:flex;flex-direction:column;gap:48px}
.label{font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;color:#9A9490;font-weight:500;margin-bottom:16px}
.row{display:flex;gap:32px;align-items:flex-end;flex-wrap:wrap}
.item{display:flex;flex-direction:column;align-items:center;gap:12px}
.sz{font-size:8px;font-family:monospace;color:#B0ACA8;letter-spacing:.08em}
.icon{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon svg.bg{position:absolute;inset:0;width:100%;height:100%}
.icon svg.mk{position:relative;z-index:1}
.icon .bar{position:absolute;bottom:0;left:0;right:0;z-index:2}
</style>
</head>
<body>

<div>
  <div class="label">Stylographic · Icon · #1E2328 Gunmetal · Brass</div>
  <div class="row">

    <!-- 512 -->
    <div class="item">
      <div class="icon" style="background:#1E2328;width:512px;height:512px">
        <svg class="bg" viewBox="0 0 512 512" preserveAspectRatio="xMidYMid slice">
          <path d="M-40 420 C120 240 340 360 560 180 C680 90 740 230 820 200" stroke="rgba(184,150,90,.14)" stroke-width="5" fill="none"/>
          <path d="M-40 280 C140 110 380 280 620 100 C740 20 820 180 860 150" stroke="rgba(184,150,90,.08)" stroke-width="3.5" fill="none"/>
          <path d="M80 520 C280 300 500 420 760 200" stroke="rgba(184,150,90,.05)" stroke-width="2.5" fill="none"/>
        </svg>
        <div class="bar" style="height:5px;background:linear-gradient(90deg,transparent,#B8965A,transparent)"></div>
        <svg class="mk" width="200" height="268" viewBox="0 0 44 62" fill="none">
          <path d="M4 3 L22 3 L22 44 L14 29 Z" fill="#B8965A" opacity=".88"/>
          <path d="M40 3 L22 3 L22 44 L30 29 Z" fill="#D4AE78" opacity=".72"/>
          <line x1="4" y1="3" x2="40" y2="3" stroke="#D4AE78" stroke-width="2" stroke-linecap="round"/>
          <line x1="22" y1="16" x2="22" y2="44" stroke="#F5F0E8" stroke-width="1.3" stroke-linecap="round" opacity=".5"/>
          <ellipse cx="22" cy="17" rx="3" ry="4" fill="#1E2328"/>
          <ellipse cx="22" cy="17" rx="1.8" ry="2.5" stroke="#D4AE78" stroke-width=".7" fill="none" opacity=".5"/>
          <rect x="17" y="28" width="10" height="2.5" rx=".8" fill="#D4AE78" opacity=".6"/>
          <circle cx="22" cy="44" r="2" fill="#D4AE78" opacity=".9"/>
          <path d="M22 47 C22 47 19 53 19 56 C19 58.8 20.3 60.2 22 60.2 C23.7 60.2 25 58.8 25 56 C25 53 22 47 22 47Z" fill="#B8965A" opacity=".78"/>
          <ellipse cx="20.8" cy="55" rx=".7" ry="1.3" fill="#F5F0E8" opacity=".28" transform="rotate(-15 20.8 55)"/>
        </svg>
      </div>
      <div class="sz">512 × 512</div>
    </div>

    <!-- 1024 -->
    <div class="item">
      <div class="icon" style="background:#1E2328;width:256px;height:256px">
        <svg class="bg" viewBox="0 0 512 512" preserveAspectRatio="xMidYMid slice">
          <path d="M-40 420 C120 240 340 360 560 180 C680 90 740 230 820 200" stroke="rgba(184,150,90,.14)" stroke-width="5" fill="none"/>
          <path d="M-40 280 C140 110 380 280 620 100 C740 20 820 180 860 150" stroke="rgba(184,150,90,.08)" stroke-width="3.5" fill="none"/>
          <path d="M80 520 C280 300 500 420 760 200" stroke="rgba(184,150,90,.05)" stroke-width="2.5" fill="none"/>
        </svg>
        <div class="bar" style="height:3px;background:linear-gradient(90deg,transparent,#B8965A,transparent)"></div>
        <svg class="mk" width="100" height="134" viewBox="0 0 44 62" fill="none">
          <path d="M4 3 L22 3 L22 44 L14 29 Z" fill="#B8965A" opacity=".88"/>
          <path d="M40 3 L22 3 L22 44 L30 29 Z" fill="#D4AE78" opacity=".72"/>
          <line x1="4" y1="3" x2="40" y2="3" stroke="#D4AE78" stroke-width="2" stroke-linecap="round"/>
          <line x1="22" y1="16" x2="22" y2="44" stroke="#F5F0E8" stroke-width="1.3" stroke-linecap="round" opacity=".5"/>
          <ellipse cx="22" cy="17" rx="3" ry="4" fill="#1E2328"/>
          <ellipse cx="22" cy="17" rx="1.8" ry="2.5" stroke="#D4AE78" stroke-width=".7" fill="none" opacity=".5"/>
          <rect x="17" y="28" width="10" height="2.5" rx=".8" fill="#D4AE78" opacity=".6"/>
          <circle cx="22" cy="44" r="2" fill="#D4AE78" opacity=".9"/>
          <path d="M22 47 C22 47 19 53 19 56 C19 58.8 20.3 60.2 22 60.2 C23.7 60.2 25 58.8 25 56 C25 53 22 47 22 47Z" fill="#B8965A" opacity=".78"/>
        </svg>
      </div>
      <div class="sz">1024 × 1024 (shown at 50%)</div>
    </div>

  </div>
</div>

</body>
</html>
